[package]
name = "vstore"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "本地向量库：槽位 + 向量，全量扫描检索"

[features]
python = ["dep:pyo3", "dep:numpy", "pyo3/extension-module", "pyo3/abi3-py310"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytemuck = "1"
simsimd = "6.5.16"
pyo3 = { version = "0.30.1", default-features = false, optional = true, }  # abi3
numpy = { version = "0.30", optional = true }

[profile.release]
lto = "thin"
codegen-units = 1
